name: CI

# Builds the project and runs every test on each push and pull request.
on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # includes Docker, which the Testcontainers tests need
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/ai-orchestrator
    env:
      # The application refuses to start without these, so CI supplies harmless placeholders.
      # The tests never call Gemini or Tavily: they use a fake model.
      GEMINI_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/ai-orchestrator/target/surefire-reports
