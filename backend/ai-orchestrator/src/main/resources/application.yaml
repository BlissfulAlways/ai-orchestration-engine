spring:
  application:
    name: ai-orchestration-engine

  datasource:
    # Real credentials come from environment variables. The defaults below are for local
    # development only and match the Docker command in this project's README.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orchestratordb}
    username: ${DB_USERNAME:orchestrator}
    password: ${DB_PASSWORD:orchestrator}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15          # 3 workers + request threads + schedulers + pipelines
      minimum-idle: 5
      connection-timeout: 10000      # fail after 10 s instead of waiting forever for a connection
      max-lifetime: 1500000          # recycle connections every 25 min (below Postgres limits)
      # Logs a warning if one connection is held longer than 20 s. Our design never holds a
      # connection during an LLM call, so this warning appearing would mean a regression.
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false              # no database access after the controller returns
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 45s  # on Ctrl+C, wait up to 45 s for in-flight work

logging:
  pattern:
    # Prints the job id (set by the pipeline and the workers) on every line; empty when none.
    level: "%5p [job=%X{jobId:-}]"

server:
  shutdown: graceful                 # finish running requests before stopping
  error:
    include-stacktrace: never        # never send Java stack traces to callers
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info         # nothing else is exposed
  endpoint:
    health:
      # Anyone gets "UP"/"DOWN". Component details (queue depth, breaker state) are shown only
      # to callers with the ADMIN role, i.e. those sending the X-Admin-Token header.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true                # adds /actuator/health/liveness and /readiness
      group:
        readiness:
          include: readinessState,db # "ready" means the database answers

gemini:
  api:
    key: ${GEMINI_API_KEY}           # no default: the app refuses to start without it
    model: gemini-2.5-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
    max-attempts: 5
    request-timeout-seconds: 60
    max-concurrent-calls: 2
    max-output-tokens: 8192
  circuit:
    failure-threshold: 5      # this many failed calls in a row opens the breaker
    cooldown-seconds: 60      # how long calls are refused before one test call is allowed

tavily:
  api:
    key: ${TAVILY_API_KEY}

orchestrator:
  cors:
    # Comma-separated list of browser origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # Secret for the key-management endpoints. No default: with no value, no key can be created.
    # At least 16 characters. In Codespaces, store it as a Codespaces secret, not in this file.
    admin-token: ${ADMIN_TOKEN:}
  limits:
    max-active-jobs-per-user: 5
  executor:
    max-workers: 3
    poll-interval-ms: 2000
    heartbeat-interval-ms: 30000
    rescue-interval-ms: 30000
    stale-task-seconds: 120
  recovery:
    interval-ms: 60000
    stale-minutes: 10
  scheduler:
    pool-size: 6
  observer:
    queue-capacity: 10000
  retention:
    days: 30                  # log rows older than this are deleted
    batch-size: 5000
    cron: "0 30 3 * * *"      # every day at 03:30 (sec min hour day month weekday)